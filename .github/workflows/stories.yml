name: VELTOR stories

on:
  schedule:
    - cron: "4,19,34,49 * * * *"   # every 15 minutes
  workflow_dispatch:         # manual "Run workflow" button
    inputs:
      post_ids:
        description: "Пересобрать сторис для постов (номера через пробел), пусто = обычная проверка"
        required: false
        default: ""
      layout:
        description: "Формат пересборки: auto (как обычно) или collage (всегда коллаж)"
        required: false
        default: "auto"

permissions:
  contents: write

concurrency:
  group: veltor-stories
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pillow==11.* numpy onnxruntime

      - run: which ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - name: Fetch new posts and render stories
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python fetch_and_render.py

      - name: Rebuild requested posts
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.post_ids != '' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python rebuild_post.py ${{ inputs.post_ids }} ${{ inputs.layout == 'collage' && '--collage' || '' }}

      - name: Commit results
        run: |
          git config user.name "veltor-stories-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json queue.json skipped.json stories sources
          git add seen_chats.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "New stories $(date -u +%Y-%m-%dT%H:%MZ)"
            # the leads workflow commits to this repo too: catch up before pushing
            pushed=0
            for i in 1 2 3; do
              if git pull --rebase && git push; then pushed=1; break; fi
              sleep 7
            done
            [ "$pushed" = 1 ]
          fi
